test:
  image: ruby:$RUBY_VERSION
  before_script:
    - apt-get update && apt-get install -y clang
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - . "$HOME/.cargo/env"
    - gem update --system
    - gem install bundler
    - bundle install
  variables:
    RB_SYS_FORCE_INSTALL_RUST_TOOLCHAIN: 'true'
  script:
    - source "$HOME/.cargo/env" && rake test
  parallel:
    matrix:
      - RUBY_VERSION: ["3.2", "3.3", "3.4", "4.0"]
